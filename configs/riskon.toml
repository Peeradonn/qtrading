# The risk-on twin: the same signal as the core, equal weights, no volatility target. Aimed at Screen 2 in a
# trending fortnight; the core covers the other regimes. Separate competition account and keys (ROOSTOO_API_KEY_RISKON).
name = "riskon"
mode = "trade"
exchange = "roostoo"
key_suffix = "_RISKON"         # reads ROOSTOO_API_KEY_RISKON / ROOSTOO_SECRET_KEY_RISKON
fee_rate = 0.001
min_trade_notional = 50.0
lookback_days = 60
competition_start = 2026-10-01
competition_days = 14
required_active_days = 8
alerts = true                  # Discord webhook / Telegram from .env
digest_every_h = 4

# The candidate pool: every crypto pair Roostoo will trade at the 2026-09-14 snapshot that Binance carries
# (OMNI and TON have no Binance history; universe.py excludes them). The rolling liquidity rule under
# [strategy] decides admission every hour, so this is a pool, not a selection. Reproduce it with
# scripts/build_universe_list.py --pool.
pairs = ["1000CHEEMS/USD", "AAVE/USD", "ADA/USD", "APT/USD", "ARB/USD",
         "ASTER/USD", "AVAX/USD", "AVNT/USD", "BIO/USD", "BMT/USD",
         "BNB/USD", "BONK/USD", "BTC/USD", "CAKE/USD", "CFX/USD",
         "CRV/USD", "DOGE/USD", "DOT/USD", "EDEN/USD", "EIGEN/USD",
         "ENA/USD", "ETH/USD", "FET/USD", "FIL/USD", "FLOKI/USD",
         "FORM/USD", "HBAR/USD", "HEMI/USD", "ICP/USD", "LINEA/USD",
         "LINK/USD", "LISTA/USD", "LTC/USD", "MIRA/USD", "NEAR/USD",
         "ONDO/USD", "OPEN/USD", "PAXG/USD", "PENDLE/USD", "PENGU/USD",
         "PEPE/USD", "PLUME/USD", "POL/USD", "PUMP/USD", "S/USD",
         "SEI/USD", "SHIB/USD", "SOL/USD", "SOMI/USD", "STO/USD",
         "SUI/USD", "TAO/USD", "TRUMP/USD", "TRX/USD", "TUT/USD",
         "UNI/USD", "VIRTUAL/USD", "WIF/USD", "WLD/USD", "WLFI/USD",
         "XLM/USD", "XPL/USD", "XRP/USD", "ZEC/USD", "ZEN/USD"]

[strategy]
lookbacks_h = [72, 168, 336]
skip_h = 12
vol_window_h = 168             # warm-up floor for the volatility estimate
vol_model = "ewma"             # chosen on forecast error, not returns - see docs/whitepaper.md
ewma_lambda = 0.99             # ~3-day half-life on hourly squared returns
min_age_h = 720
liquidity_min_daily = 5_000_000   # the liquidity floor as a rolling rule: in the pool once trailing
                                   #   7-day Binance volume is $5M/day (universe_bias_study, 2026-09-18)
liquidity_window_h = 168          # ...averaged over the trailing 7 days. This is the code's default, written
                                   #   out so the whole rule can be read from this file
k = 6
buffer_rank = 12
select_hour_utc = 0            # select at 00:00 UTC, as backtested - not 24h after start-up
weighting = "equal"
drift_band = 0.05

[paths]
wallet = "data/live/riskon_wallet.json"
journal = "logs/riskon.jsonl"
memory = "data/live/riskon_memory.json"
state = "data/live/riskon_state.json"

[limits]
max_orders_per_cycle = 12
max_order_fraction = 0.6
data_max_lag_h = 2
data_deadline_s = 300
equity_jump_alert = 0.05
